<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>Diary · Committen</title>
  <link rel="stylesheet" href="./diary.css" />
</head>
<body>
  <header>
    <h1>Diary</h1>
    <div class="streak-row" id="streak-row" hidden>
      <span id="streak-current">0</span>
      <span class="streak-label">day streak</span>
      <span class="streak-sep">·</span>
      <span class="streak-best">best <span id="streak-best">0</span></span>
    </div>
  </header>

  <main id="diary-main">
    <p id="empty-state" class="empty" hidden>
      No events yet. Make a commit (or open a non-whitelisted app) and Tiddy will start logging.
    </p>
    <div id="day-list"></div>
  </main>

  <footer class="actions">
    <button id="close-btn" type="button" class="btn-ghost">Close</button>
  </footer>

  <script src="./diary.js"></script>
</body>
</html>
