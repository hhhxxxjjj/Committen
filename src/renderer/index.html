<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self';" />
  <title>Committen</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="cat" class="cat">
    <!-- 饱腹感血条 + 数字(顶部居中) -->
    <div class="cat-hunger" id="catHunger" data-level="full">
      <div class="cat-hunger-bar">
        <div class="cat-hunger-fill" id="hungerFill"></div>
      </div>
      <div class="cat-hunger-num" id="hungerNum">--</div>
    </div>

    <div class="cat-sprite-wrapper">
      <div class="cat-sprite-pacer">
        <!-- sprite 状态类(cat-sprite--idle 等)由 cat.js 在 onPack 后挂上,
             避免在 pack 到达前出现"无图但已动画"的状态。 -->
        <div class="cat-sprite" id="catSprite"></div>
      </div>
      <!-- v0.2.1:脚下软阴影,给 procedural pet 一点"贴在桌面"的重量感 -->
      <div class="cat-shadow" aria-hidden="true"></div>
    </div>
    <div class="cat-hint" id="catHint">Drag to move · ⚙ for actions</div>

    <!-- 唯一可见按钮:settings 齿轮(右上) -->
    <button class="cat-ctrl cat-ctrl--menu" id="btnMenu" title="Menu">⚙</button>

    <!-- 弹出菜单(默认隐藏)。v0.2.1+:剥离 emoji,纯文本菜单 -->
    <div class="cat-menu" id="catMenu" hidden>
      <button class="cat-menu-item" id="menuHatch">Hatch from photo…</button>
      <button class="cat-menu-item" id="menuPets">Pets…</button>
      <div class="cat-menu-divider"></div>
      <button class="cat-menu-item" id="menuWhitelist">Whitelist…</button>
      <button class="cat-menu-item" id="menuHide" title="Use the tray icon to show her again">Hide cat</button>
      <button class="cat-menu-item" id="menuReset">Reset position</button>
      <button class="cat-menu-item" id="menuConfig">Open config…</button>
      <div class="cat-menu-divider"></div>
      <button class="cat-menu-item cat-menu-item--danger" id="menuQuit">Quit Committen</button>
    </div>
  </div>

  <script src="cat.js"></script>
</body>
</html>
